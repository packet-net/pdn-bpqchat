name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # Go from go.mod, installed in the job: the donated runners have no Go of their own. Cache is
      # off on self-hosted runners, as it is for .NET, so nothing large is uploaded from them.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      # The race detector needs cgo, so it needs a C compiler.
      - name: Check the tools this job needs
        run: scripts/ci-require-tools.sh gcc:gcc
      - name: Go version
        run: go version
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: Test (race)
        run: go test -race ./...
